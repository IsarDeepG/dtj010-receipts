<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DTJ010 receipts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,550&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1c1917; --muted:#6f675f; --line:#e6dfd6; --paper:#f6f1ea; --card:#fffcf8;
    --brass:#8a5a2b; --ok:#1f6b45; --ok-bg:#e7f4ec; --wait:#8a5a2b; --wait-bg:#f8efe4;
    --part:#3d4f86; --part-bg:#e8edf8; --empty:#a39b93;
  }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); background:var(--paper); font-family:Outfit, sans-serif; }
  main { max-width:1080px; margin:0 auto; padding:28px 22px 72px; }
  header { display:flex; justify-content:space-between; gap:16px; align-items:flex-end; flex-wrap:wrap; }
  .kicker { letter-spacing:.16em; text-transform:uppercase; font-size:11px; color:var(--brass); margin:0; }
  h1 { font-family:Newsreader, Georgia, serif; font-weight:550; font-size:36px; margin:6px 0 0; letter-spacing:-.02em; }
  .modes { display:flex; background:#fff; border:1px solid var(--line); border-radius:999px; padding:4px; }
  .modes button { font:inherit; border:0; background:transparent; border-radius:999px; padding:8px 16px; cursor:pointer; color:var(--muted); }
  .modes button.on { background:var(--ink); color:#f7f4ef; }
  .toolbar { display:flex; gap:12px; align-items:center; margin:22px 0 14px; flex-wrap:wrap; }
  label.quiet { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  select.year, input, select.field {
    font:inherit; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:8px 10px; color:var(--ink);
  }
  .months { display:grid; grid-template-columns:repeat(12, 1fr); gap:6px; }
  .months button {
    font:inherit; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:10px 4px 8px; cursor:pointer; text-align:center;
  }
  .months button small { display:block; color:var(--muted); font-size:11px; }
  .months button b { display:block; font-weight:500; font-size:13px; margin-bottom:6px; }
  .months button i { display:block; width:7px; height:7px; border-radius:99px; margin:0 auto; background:var(--empty); font-style:normal; }
  .months button.paid i { background:var(--ok); }
  .months button.unpaid i { background:var(--wait); }
  .months button.part i { background:var(--part); }
  .months button.on { border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
  .layout { display:grid; grid-template-columns:280px 1fr; gap:16px; margin-top:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .card h2 { font-family:Newsreader, Georgia, serif; font-weight:550; font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 14px; }
  .stat { padding:10px 0; border-top:1px solid var(--line); }
  .stat span { display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .stat strong { font-family:Newsreader, Georgia, serif; font-size:26px; font-weight:550; }
  .pill { display:inline-block; border-radius:999px; padding:3px 8px; font-size:12px; }
  .pill.unpaid { background:var(--wait-bg); color:var(--wait); }
  .pill.paid { background:var(--ok-bg); color:var(--ok); }
  .pill.part { background:var(--part-bg); color:var(--part); }
  .pill.empty { background:#eeeae4; color:#5c564f; }
  table { width:100%; border-collapse:collapse; }
  td { padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .hero { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .payable { font-family:Newsreader, Georgia, serif; font-size:40px; margin:8px 0 0; }
  a.file { display:flex; justify-content:space-between; gap:12px; text-decoration:none; color:inherit; padding:12px 0; border-top:1px solid var(--line); }
  a.file b { font-weight:500; }
  a.file span { color:var(--muted); font-size:13px; }
  .gate, .editor { margin-top:14px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field label { display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .field input, .field select { width:100%; }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; font:inherit; border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px; cursor:pointer; }
  .seg button.on { background:var(--ink); color:#f7f4ef; border-color:var(--ink); }
  .save { font:inherit; background:var(--ink); color:#f7f4ef; border:0; border-radius:10px; padding:10px 14px; cursor:pointer; }
  .note { color:var(--muted); font-size:13px; }
  .err { color:#8d2f2f; font-size:13px; min-height:1.2em; }
  @media (max-width:860px) {
    .months { grid-template-columns:repeat(6, 1fr); }
    .layout, .row { grid-template-columns:1fr; }
    h1 { font-size:30px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="kicker">DTJ010 · DLF Towers B, Jasola</p>
      <h1>Receipts</h1>
    </div>
    <div class="modes">
      <button type="button" id="viewBtn" class="on">View only</button>
      <button type="button" id="editBtn">Edit</button>
    </div>
  </header>

  <div class="toolbar">
    <label class="quiet" for="year">Licence year</label>
    <select id="year" class="year">
      <option value="2026-27">2026–27 · 10 Sep 2026 to 9 Aug 2027</option>
    </select>
  </div>
  <div class="months" id="months"></div>

  <div class="layout">
    <aside class="card">
      <h2>This year</h2>
      <p class="sub">Security, advance and licence fee are separate from the DLF bills.</p>
      <div class="stat"><span>Receipts received</span><strong id="yearReceipts">Rs 0</strong></div>
      <div class="stat"><span>DLF invoiced</span><strong id="yearInvoiced">Rs 0</strong></div>
      <div class="stat"><span>Still to collect</span><strong id="yearDue">Rs 0</strong></div>
      <div id="receiptEdit" hidden>
        <p class="sub" style="margin-top:16px">Opening receipts</p>
        <div class="field"><label>Security deposit</label><input id="rSecurity" inputmode="decimal"></div>
        <div class="field"><label>One month advance</label><input id="rAdvance" inputmode="decimal"></div>
        <div class="field"><label>Licence fee received</label><input id="rFees" inputmode="decimal"></div>
      </div>
    </aside>

    <section class="card" id="detail"></section>
  </div>
</main>
<script>
const USER = "isar.gangwani@gmail.com";
const PASS = "DLFpassword";
const KEY = "dtj010-portal-v2";
const MONTHS = [
  ["2026-09","Sep","Sep 2026"],["2026-10","Oct","Oct 2026"],["2026-11","Nov","Nov 2026"],
  ["2026-12","Dec","Dec 2026"],["2027-01","Jan","Jan 2027"],["2027-02","Feb","Feb 2027"],
  ["2027-03","Mar","Mar 2027"],["2027-04","Apr","Apr 2027"],["2027-05","May","May 2027"],
  ["2027-06","Jun","Jun 2027"],["2027-07","Jul","Jul 2027"],["2027-08","Aug","Aug 2027"]
];
const FILES = {
  "2026-10": [
    ["DTJ010_Email_Oct2026.pdf","Email to the vendor","To Rizwanqureshi435@gmail.com"],
    ["DTJ010_Invoice_Oct2026.pdf","Invoice","Rs 13,958.82"],
    ["DTJ010_DLF_Electricity_Sep2026.pdf","DLF electricity bill","Sep 2026 · EB/2026-27/1775"],
    ["DTJ010_DLF_Maintenance_Oct2026.pdf","DLF maintenance bill","Oct 2026 · MB/2026-27/2106"]
  ]
};
const seed = {
  selected: "2026-10",
  mode: "view",
  receipts: { security: 116000, advance: 58000, fees: 58000 },
  months: {
    "2026-10": {
      elec: 1476.64, elecLabel: "Electricity, Sep usage after 10-day cut",
      maint: 12482.18, maintLabel: "Maintenance, Oct DLF bill",
      status: "Unpaid", paid: 0, paidOn: "", ref: ""
    }
  }
};
const inr = n => "Rs " + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const inr0 = n => "Rs " + Math.round(Number(n || 0)).toLocaleString("en-IN");
function load() {
  try { return Object.assign({}, seed, JSON.parse(localStorage.getItem(KEY) || "{}"), { months: Object.assign({}, seed.months, (JSON.parse(localStorage.getItem(KEY) || "{}").months) || {}) }); }
  catch (e) { return JSON.parse(JSON.stringify(seed)); }
}
function save(state) { localStorage.setItem(KEY, JSON.stringify(state)); }
let state = load();
if (!state.selected) state.selected = "2026-10";

function monthStatus(id) {
  const m = state.months[id];
  if (!m || ((Number(m.elec) || 0) === 0 && (Number(m.maint) || 0) === 0)) return "empty";
  if (m.status === "Paid") return "paid";
  if (m.status === "Part paid") return "part";
  return "unpaid";
}
function payable(m) { return (Number(m?.elec) || 0) + (Number(m?.maint) || 0); }

function paintMonths() {
  document.getElementById("months").innerHTML = MONTHS.map(([id, short]) => {
    const st = monthStatus(id);
    return `<button type="button" data-id="${id}" class="${st}${state.selected===id?" on":""}"><b>${short}</b><small>${id.slice(0,4)}</small><i></i></button>`;
  }).join("");
  document.querySelectorAll("#months button").forEach(btn => btn.onclick = () => { state.selected = btn.dataset.id; paint(); });
}
function paintYear() {
  const rec = Number(state.receipts.security) + Number(state.receipts.advance) + Number(state.receipts.fees);
  let invoiced = 0, collected = 0;
  Object.values(state.months).forEach(m => { invoiced += payable(m); collected += Number(m.paid) || 0; });
  document.getElementById("yearReceipts").textContent = inr0(rec);
  document.getElementById("yearInvoiced").textContent = inr(invoiced);
  document.getElementById("yearDue").textContent = inr(Math.max(0, invoiced - collected));
  document.getElementById("rSecurity").value = state.receipts.security;
  document.getElementById("rAdvance").value = state.receipts.advance;
  document.getElementById("rFees").value = state.receipts.fees;
  document.getElementById("receiptEdit").hidden = state.mode !== "edit" || sessionStorage.getItem("dtj010-auth") !== "1";
}
function fileList(id) {
  const files = FILES[id] || [];
  if (!files.length) return `<p class="note">No files for this month yet.</p>`;
  return files.map(([href, name, meta]) => `<a class="file" href="${href}"><b>${name}</b><span>${meta}</span></a>`).join("");
}
function paintDetail() {
  const id = state.selected;
  const label = MONTHS.find(m => m[0] === id)[2];
  const m = state.months[id] || { elec:0, maint:0, status:"", paid:0, paidOn:"", ref:"", elecLabel:"Electricity", maintLabel:"Maintenance" };
  const st = monthStatus(id);
  const statusText = st === "empty" ? "Not invoiced" : (m.status || "Unpaid");
  const pill = st === "empty" ? "empty" : st;
  const authed = sessionStorage.getItem("dtj010-auth") === "1";
  const editing = state.mode === "edit" && authed;
  const gate = state.mode === "edit" && !authed;
  let html = `<div class="hero"><div><p class="kicker">${label}</p><h2>${st==="empty"?"No invoice yet":"Amount payable"}</h2>${st==="empty"?"":`<p class="payable">${inr(payable(m))}</p>`}</div><span class="pill ${pill}">${statusText}</span></div>`;
  if (!gate && st !== "empty") {
    html += `<table>
      <tr><td>${m.elecLabel || "Electricity"}</td><td class="num">${inr(m.elec)}</td></tr>
      <tr><td>${m.maintLabel || "Maintenance"}</td><td class="num">${inr(m.maint)}</td></tr>
      <tr><td>Received against this invoice</td><td class="num">${inr(m.paid)}</td></tr>
    </table>`;
    if (m.ref || m.paidOn) html += `<p class="note">${[m.paidOn, m.ref].filter(Boolean).join(" · ")}</p>`;
  }
  if (!gate) html += `<h2 style="margin-top:18px">Files</h2>${fileList(id)}`;
  if (gate) {
    html += `<div class="gate"><p class="sub">Edit is only for Isar.</p>
      <div class="field"><label>Email</label><input id="email" type="email" value="isar.gangwani@gmail.com"></div>
      <div class="field"><label>Password</label><input id="password" type="password"></div>
      <button class="save" type="button" id="login">Open edit</button>
      <p class="err" id="loginErr"></p></div>`;
  }
  if (editing) {
    html += `<div class="editor">
      <p class="sub">You are editing ${label}. Receipts on the left are not part of this invoice.</p>
      <div class="row">
        <div class="field"><label>Electricity charged</label><input id="fElec" inputmode="decimal" value="${m.elec || ""}"></div>
        <div class="field"><label>What the electricity line should say</label><input id="fElecLabel" value="${m.elecLabel || "Electricity"}"></div>
        <div class="field"><label>Maintenance charged</label><input id="fMaint" inputmode="decimal" value="${m.maint || ""}"></div>
        <div class="field"><label>What the maintenance line should say</label><input id="fMaintLabel" value="${m.maintLabel || "Maintenance"}"></div>
        <div class="field"><label>Received against this invoice</label><input id="fPaid" inputmode="decimal" value="${m.paid || 0}"></div>
        <div class="field"><label>Paid on</label><input id="fPaidOn" type="date" value="${m.paidOn || ""}"></div>
      </div>
      <div class="field"><label>Bank reference</label><input id="fRef" value="${m.ref || ""}" placeholder="IMPS reference"></div>
      <div class="field"><label>Status</label><div class="seg" id="seg">
        ${["Unpaid","Part paid","Paid"].map(s => `<button type="button" data-s="${s}" class="${(m.status||"Unpaid")===s?"on":""}">${s}</button>`).join("")}
      </div></div>
      <button class="save" type="button" id="saveMonth">Save ${label}</button>
      <p class="note" id="saved"></p>
    </div>`;
  }
  document.getElementById("detail").innerHTML = html;
  const login = document.getElementById("login");
  if (login) login.onclick = () => {
    const ok = document.getElementById("email").value.trim().toLowerCase() === USER && document.getElementById("password").value === PASS;
    document.getElementById("loginErr").textContent = ok ? "" : "Email or password is wrong.";
    if (!ok) return;
    sessionStorage.setItem("dtj010-auth", "1");
    paint();
  };
  document.querySelectorAll("#seg button").forEach(btn => btn.onclick = () => {
    document.querySelectorAll("#seg button").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
  });
  const saveBtn = document.getElementById("saveMonth");
  if (saveBtn) saveBtn.onclick = () => {
    const statusBtn = document.querySelector("#seg button.on");
    state.months[id] = {
      elec: Number(document.getElementById("fElec").value) || 0,
      elecLabel: document.getElementById("fElecLabel").value || "Electricity",
      maint: Number(document.getElementById("fMaint").value) || 0,
      maintLabel: document.getElementById("fMaintLabel").value || "Maintenance",
      paid: Number(document.getElementById("fPaid").value) || 0,
      paidOn: document.getElementById("fPaidOn").value,
      ref: document.getElementById("fRef").value,
      status: statusBtn ? statusBtn.dataset.s : "Unpaid"
    };
    state.receipts = {
      security: Number(document.getElementById("rSecurity").value) || 0,
      advance: Number(document.getElementById("rAdvance").value) || 0,
      fees: Number(document.getElementById("rFees").value) || 0
    };
    save(state);
    paint();
    const note = document.getElementById("saved");
    if (note) note.textContent = "Saved in this browser.";
  };
}
function paint() {
  document.getElementById("viewBtn").classList.toggle("on", state.mode !== "edit");
  document.getElementById("editBtn").classList.toggle("on", state.mode === "edit");
  paintMonths();
  paintYear();
  paintDetail();
}
document.getElementById("viewBtn").onclick = () => { state.mode = "view"; paint(); };
document.getElementById("editBtn").onclick = () => { state.mode = "edit"; paint(); };
["rSecurity","rAdvance","rFees"].forEach(id => {
  document.getElementById(id).addEventListener("change", () => {
    if (sessionStorage.getItem("dtj010-auth") !== "1") return;
    state.receipts[id === "rSecurity" ? "security" : id === "rAdvance" ? "advance" : "fees"] = Number(document.getElementById(id).value) || 0;
    save(state); paintYear();
  });
});
paint();
</script>
</body>
</html>
